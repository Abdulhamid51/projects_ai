<!doctype html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>UNO Online</title>
<style>
:root{--red:#e53935;--yellow:#fdd835;--green:#43a047;--blue:#1e88e5;--bg:#14202e}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:radial-gradient(circle at 50% 30%,#22405e,var(--bg));color:#fff;min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:16px}
h1{text-align:center;font-size:48px;margin:20px 0;letter-spacing:4px;color:var(--yellow);text-shadow:3px 3px var(--red)}
input,button{font:inherit;padding:12px 16px;border-radius:10px;border:0}
input{width:100%;margin:6px 0;text-transform:none}
button{background:var(--blue);color:#fff;font-weight:700;cursor:pointer}
button:disabled{opacity:.4}button.sec{background:#455a64}button.red{background:var(--red)}
.box{background:#0006;border-radius:14px;padding:16px;margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.card{width:64px;height:96px;border-radius:10px;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#fff;text-shadow:1px 1px 2px #0008;flex:none;position:relative;user-select:none}
.card.red{background:var(--red)}.card.yellow{background:var(--yellow);color:#222;text-shadow:none}.card.green{background:var(--green)}.card.blue{background:var(--blue)}
.card.wild{background:conic-gradient(var(--red) 0 25%,var(--blue) 0 50%,var(--green) 0 75%,var(--yellow) 0)}
.card.back{background:#111;color:var(--red);font-size:16px!important}
.hand .card{cursor:pointer;transition:.12s}.hand .card.no{opacity:.4;cursor:default}.hand .card.ok{transform:translateY(-10px);box-shadow:0 0 12px #fff}
.pl{padding:6px 12px;border-radius:20px;background:#0005;border:2px solid transparent}
.pl.turn{border-color:var(--yellow);background:#fdd83533}.pl.off{opacity:.4}
.pile .card{width:84px;height:126px;font-size:38px}
.ring{position:absolute;inset:-8px;border-radius:14px;border:4px solid;pointer-events:none}
#log{font-size:13px;opacity:.8;text-align:center;min-height:36px}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#c62828;padding:10px 18px;border-radius:10px;display:none;z-index:9}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:8}
#modal button{width:80px;height:80px;border-radius:50%;margin:8px}
.code{font-size:44px;font-weight:800;letter-spacing:8px;text-align:center;color:var(--yellow)}
.hide{display:none!important}
</style></head><body><div class="wrap">
<h1>UNO</h1><div id="toast"></div>
<div id="modal"><div class="row" id="colors"></div></div>

<div id="auth" class="box">
  <input id="user" placeholder="Foydalanuvchi nomi" maxlength="14" autocomplete="username">
  <input id="pw" type="password" placeholder="Parol (kamida 6 belgi)" autocomplete="current-password">
  <div class="row"><button id="login">Kirish</button><button id="reg" class="sec">Ro'yxatdan o'tish</button></div>
</div>
<div id="home" class="box hide">
  <div class="row" style="justify-content:space-between;margin-bottom:6px"><span>👤 <b id="me"></b></span><button class="sec" id="logout" style="padding:6px 12px">Chiqish</button></div>
  <button id="create" style="width:100%;margin:6px 0">🎮 Yangi xona yaratish</button>
  <div class="row" style="margin-top:10px"><input id="codeIn" placeholder="Xona kodi" maxlength="4" style="flex:1;width:auto;text-transform:uppercase"><button id="join">Qo'shilish</button></div>
</div>

<div id="lobby" class="box hide">
  <div style="text-align:center">Xona kodi</div><div class="code" id="code"></div>
  <div class="row" style="margin:10px 0"><button class="sec" id="copy">🔗 Havolani nusxalash</button></div>
  <div class="row" id="lplayers"></div>
  <div class="row" style="margin-top:14px"><button id="start">▶ Boshlash</button><button class="sec" id="leave1">Chiqish</button></div>
  <p id="lwait" style="text-align:center;opacity:.7"></p>
</div>

<div id="game" class="hide">
  <div class="row" id="gplayers"></div>
  <div class="box row pile">
    <div class="card back" id="deck" style="cursor:pointer">UNO</div>
    <div class="card" id="topc"></div>
  </div>
  <div class="row"><span id="status" style="font-size:20px;font-weight:700"></span></div>
  <div class="row" style="margin:8px"><button class="sec" id="pass">O'tkazish</button><button class="sec" id="leave2">Chiqish</button></div>
  <div class="row hand" id="hand" style="margin-top:20px"></div>
  <div id="log"></div>
  <div id="over" class="box hide" style="text-align:center"><h2 id="win"></h2><button id="again">Qayta o'ynash</button></div>
</div>
</div>
<script>
const $=id=>document.getElementById(id), store=localStorage;
const SYM={skip:'⊘',rev:'⇄','+2':'+2','+4':'+4',wild:'★'};
const NAMES={red:'#e53935',yellow:'#fdd835',green:'#43a047',blue:'#1e88e5'};
let ws,S,pend=null,sess=JSON.parse(store.uno||'null'),acct=JSON.parse(store.unoAcct||'null');
const url=new URL(location);
if(url.searchParams.get('room'))$('codeIn').value=url.searchParams.get('room');

function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2200)}
function send(m){ws&&ws.readyState===1?ws.send(JSON.stringify(m)):toast('Ulanmagan...')}
function connect(){
  const w=ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  w.onopen=()=>send({t:'auth',token:acct.token});
  w.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.t==='authed'){if(sess)send({t:'rejoin',code:sess.code})}
    else if(m.t==='joined'){sess={code:m.code};store.uno=JSON.stringify(sess);history.replaceState(0,'','?room='+m.code)}
    else if(m.t==='kicked'){w.onclose=null;S=null;render();toast('Boshqa oynada ochildi')}
    else if(m.t==='err'){toast(m.msg);if(m.auth)logout();else if(m.fatal){delete store.uno;sess=null;S=null;render()}}
    else if(m.t==='state'){S=m;render()}};
  w.onclose=()=>{if(acct&&ws===w)setTimeout(connect,1500)};
}
const enter=m=>send(m);
async function auth(kind){
  const r=await fetch('/api/'+kind,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:$('user').value.trim(),password:$("pw").value})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)return toast(d.err||'Xatolik');
  acct=d;store.unoAcct=JSON.stringify(d);$('pw').value='';$('me').textContent=d.name;render();connect();
}
function logout(){
  if(sess)send({t:'leave'});
  acct=sess=S=null;delete store.unoAcct;delete store.uno;try{ws.close()}catch(e){}
  history.replaceState(0,'','/');render();
}
$('login').onclick=()=>auth('login');$('reg').onclick=()=>auth('register');$('logout').onclick=logout;
$('create').onclick=()=>enter({t:'create'});
$('join').onclick=()=>enter({t:'join',code:$('codeIn').value.trim().toUpperCase()});
$('start').onclick=()=>send({t:'start'});$('again').onclick=()=>send({t:'start'});
$('deck').onclick=()=>send({t:'draw'});$('pass').onclick=()=>send({t:'pass'});
const leave=()=>{send({t:'leave'});delete store.uno;sess=null;S=null;history.replaceState(0,'','/');render()};
$('leave1').onclick=$('leave2').onclick=leave;
$('copy').onclick=()=>{const u=location.origin+'/?room='+S.code;navigator.clipboard?navigator.clipboard.writeText(u).then(()=>toast('Nusxalandi!')):prompt('Havola:',u)};
$('colors').innerHTML=Object.keys(NAMES).map(c=>`<button data-c="${c}" style="background:${NAMES[c]}"></button>`).join('');
$('colors').onclick=e=>{const c=e.target.dataset.c;if(c&&pend){send({t:'play',card:pend,color:c});pend=null;$('modal').style.display='none'}};
$('modal').onclick=e=>{if(e.target.id==='modal'){pend=null;$('modal').style.display='none'}};

function cardEl(c,cls=''){return `<div class="card ${c.c||'wild'} ${cls}" data-id="${c.id}">${/^\d$/.test(c.v)?c.v:SYM[c.v]}</div>`}
function render(){
  const st=S?S.state:'home';
  $('auth').classList.toggle('hide',st!=='home'||!!acct);
  $('home').classList.toggle('hide',st!=='home'||!acct);
  $('lobby').classList.toggle('hide',st!=='lobby');
  $('game').classList.toggle('hide',st!=='play'&&st!=='over');
  if(!S)return;
  const names=S.players.map(p=>`<div class="pl ${p.id===S.turn?'turn':''} ${p.on?'':'off'}">${p.name}${p.id===S.host?' 👑':''}${st==='lobby'?'':' · '+p.n}</div>`).join('');
  if(st==='lobby'){
    $('code').textContent=S.code;$('lplayers').innerHTML=names;
    const h=S.host===S.you;$('start').classList.toggle('hide',!h);$('start').disabled=S.players.length<2;
    $('lwait').textContent=h?(S.players.length<2?"Do'stingizni kuting...":''):"Xona egasi boshlashini kuting...";
    return;
  }
  $('gplayers').innerHTML=names;
  $('topc').className='card '+(S.top.c||'wild');$('topc').textContent=/^\d$/.test(S.top.v)?S.top.v:SYM[S.top.v];
  $('topc').innerHTML=$('topc').textContent+`<div class="ring" style="border-color:${NAMES[S.color]}"></div>`;
  const mine=S.turn===S.you;
  $('status').textContent=st==='over'?'':mine?(S.drawn?'Olingan kartani tashlang yoki o\'tkazing':'🔔 Sizning navbatingiz!'):'Kutilmoqda: '+(S.players.find(p=>p.id===S.turn)||{}).name;
  $('pass').classList.toggle('hide',!S.drawn);
  $('hand').innerHTML=S.hand.map(c=>cardEl(c,c.ok?'ok':'no')).join('');
  $('log').innerHTML=S.log.slice(-4).join('<br>');
  $('over').classList.toggle('hide',st!=='over');
  if(st==='over'){$('win').textContent='🏆 '+S.winner+' yutdi!';$('again').classList.toggle('hide',S.host!==S.you)}
}
$('hand').onclick=e=>{const el=e.target.closest('.card');if(!el||!el.classList.contains('ok'))return;
  const c=S.hand.find(x=>x.id==el.dataset.id);
  if(!c.c){pend=c.id;$('modal').style.display='flex'}else send({t:'play',card:c.id})};
if(acct){$('me').textContent=acct.name;connect()}
render();
</script></body></html>
