services:
  - type: web
    name: uno-online
    runtime: node
    plan: free
    rootDir: uno
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false   # Render dashboard'da @BotFather tokenini kiriting
      - key: UPSTASH_REDIS_REST_URL
        sync: false   # Upstash Redis → REST API → URL (akkaunt va jadvalli xonalar shu yerda saqlanadi)
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
