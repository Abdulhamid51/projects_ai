name: Build APK
on:
  push:
    paths: ['music_app/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle -p music_app assembleDebug assembleRelease --no-daemon --stacktrace
      - name: Diagnose APK
        continue-on-error: true
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          for a in music_app/app/build/outputs/apk/*/*.apk; do
            echo "=== $a"; ls -l "$a"
            $BT/aapt2 dump badging "$a" | grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission|application-label|native-code|launchable)" || true
            $BT/aapt2 dump xmltree "$a" --file AndroidManifest.xml | grep -iE "debuggable|extractNativeLibs|testOnly" || true
            $BT/apksigner verify --verbose --print-certs "$a" | head -12 || true
            $BT/zipalign -c -P 16 -v 4 "$a" | tail -3 || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: music-app-apk
          path: music_app/app/build/outputs/apk/*/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Musiqa app (APK)
          files: |
            music_app/app/build/outputs/apk/debug/app-debug.apk
            music_app/app/build/outputs/apk/release/app-release.apk
