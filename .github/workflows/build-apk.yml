name: Build APK
on:
  push:
    paths: ['music_app/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle -p music_app assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: music-app-apk
          path: music_app/app/build/outputs/apk/debug/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Musiqa app (APK)
          files: music_app/app/build/outputs/apk/debug/app-debug.apk
